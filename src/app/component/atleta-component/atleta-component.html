<section id="form">
    <h2> Cadastro de Atleta </h2>

    <form (ngSubmit)="cadastrarAtleta()" id="form-atleta">

        <label for="nome">Nome Completo*</label>
        <input
            type="text"
            name="nome"
            id="nome"
            class="input01"
            maxlength="60"
            required
            placeholder="Digite o nome Completo"
            [(ngModel)]="atleta.nome">

        <label for="cpf">CPF*</label>
        <input
            type="text"
            name="cpf"
            id="cpf"
            class="input02"
            maxlength="14"
            required
            placeholder="Digite o cpf"
            [(ngModel)]="atleta.cpf">

        <label for="dataNascimento">Data de Nascimento*</label>
        <input
            type="date"
            name="dataNascimento"
            id="dataNascimento"
            class="input02"
            required
            [(ngModel)]="atleta.dataNascimento">

        <label for="sexo">Sexo</label>

        <input
            type="radio"
            name="sexo"
            id="sexoM"
            class="radio01"
            required
            value="M"
            [(ngModel)]="atleta.sexo">
        Masculino

        <input
            type="radio"
            name="sexo"
            id="sexoF"
            class="radio01"
            required
            value="F"
            [(ngModel)]="atleta.sexo">
        Feminino

        <input
            type="radio"
            name="sexo"
            id="sexoN"
            class="radio01"
            required
            value="N"
            [(ngModel)]="atleta.sexo">
        Não Declarar

        <label for="cep">CEP*</label>
        <input
            type="text"
            name="cep"
            id="cep"
            class="input02"
            maxlength="9"
            required
            placeholder="Digite o cep"
            [(ngModel)]="atleta.cep">

        <label for="rua-logradouro">Rua/Logradouro*</label>
        <input
            type="text"
            name="ruaLogradouro"
            id="rua-logradouro"
            class="input01"
            maxlength="100"
            required
            placeholder="Digite a Rua ou o Logradouro"
            [(ngModel)]="atleta.ruaLogradouro">

        <label for="bairro">Bairro*</label>
        <input
            type="text"
            name="bairro"
            id="bairro"
            class="input02"
            maxlength="60"
            required
            placeholder="Digite o bairro"
            [(ngModel)]="atleta.bairro">

        <label for="cidade">Cidade*</label>
        <input
            type="text"
            name="cidade"
            id="cidade"
            class="input02"
            maxlength="60"
            required
            placeholder="Digite a cidade"
            [(ngModel)]="atleta.cidade">

        <label for="uf">Estado*</label>
        <select
            name="uf"
            id="uf"
            class="input02"
            required
            [(ngModel)]="atleta.uf">

            <option value="">Selecione o estado</option>
            <option value="AC">Acre - AC</option>
            <option value="AL">Alagoas - AL</option>
            <option value="AP">Amapá - AP</option>
            <option value="AM">Amazonas - AM</option>
            <option value="BA">Bahia - BA</option>
            <option value="CE">Ceará - CE</option>
            <option value="DF">Distrito Federal - DF</option>
            <option value="ES">Espírito Santo - ES</option>
            <option value="GO">Goiás - GO</option>
            <option value="MA">Maranhão - MA</option>
            <option value="MT">Mato Grosso - MT</option>
            <option value="MS">Mato Grosso do Sul - MS</option>
            <option value="MG">Minas Gerais - MG</option>
            <option value="PA">Pará - PA</option>
            <option value="PB">Paraíba - PB</option>
            <option value="PR">Paraná - PR</option>
            <option value="PE">Pernambuco - PE</option>
            <option value="PI">Piauí - PI</option>
            <option value="RJ">Rio de Janeiro - RJ</option>
            <option value="RN">Rio Grande do Norte - RN</option>
            <option value="RS">Rio Grande do Sul - RS</option>
            <option value="RO">Rondônia - RO</option>
            <option value="RR">Roraima - RR</option>
            <option value="SC">Santa Catarina - SC</option>
            <option value="SP">São Paulo - SP</option>
            <option value="SE">Sergipe - SE</option>
            <option value="TO">Tocantins - TO</option>

        </select>

        <label for="peso">Peso (kg)*</label>
        <input 
            type="number" 
            step="0.1" 
            id="peso" 
            name="peso" 
            class="input02" 
            required
            placeholder="Ex: 70.5"
            [(ngModel)]="atleta.peso">
        
        <label for="altura">Altura (m)*</label>
        <input 
            type="number" 
            step="0.01" 
            id="altura" 
            name="altura" 
            class="input02" 
            required
            placeholder="Ex: 1.75"
            [(ngModel)]="atleta.altura">

        <div id="div-btns">
            <button type="submit" id="btnAdd">Cadastrar</button>
            <button type="button" (click)="limparDados()" id="btnLimpar">Limpar</button>
        </div>

    </form>
</section>
